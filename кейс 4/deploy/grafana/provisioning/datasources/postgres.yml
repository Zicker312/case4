apiVersion: 1
datasources:
  - name: Maintenance PostgreSQL
    uid: postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: $__env{GRAFANA_DB_USER}
    secureJsonData:
      password: $__env{GRAFANA_DB_PASSWORD}
    jsonData:
      database: $__env{GRAFANA_DB_NAME}
      sslmode: disable
      postgresVersion: 16
      timescaledb: false
