worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types; default_type application/octet-stream; sendfile on; gzip on;
  gzip_types application/json text/plain text/css application/javascript;
  client_max_body_size 100k; proxy_connect_timeout 5s; proxy_send_timeout 15s; proxy_read_timeout 30s;
  log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request","status":$status,"request_id":"$http_x_request_id"}';
  access_log /var/log/nginx/access.log json;
  upstream api_upstream { server api:3000; } upstream grafana_upstream { server grafana:3000; }
  server { listen 80; server_name _;
    add_header X-Content-Type-Options nosniff always; add_header X-Frame-Options SAMEORIGIN always;
    location = /nginx-health { access_log off; return 200 'ok\n'; add_header Content-Type text/plain; }
    location /api/ { proxy_pass http://api_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-Id $http_x_request_id; }
    location = /metrics { auth_basic "Metrics"; auth_basic_user_file /etc/nginx/.htpasswd; proxy_pass http://api_upstream/metrics; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location /grafana/ { auth_basic "Grafana"; auth_basic_user_file /etc/nginx/.htpasswd; proxy_pass http://grafana_upstream/grafana/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_http_version 1.1; }
    location / { proxy_pass http://api_upstream; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-Id $http_x_request_id; }
  }
}
