<!doctype html><html lang="ru"><head><meta charset="UTF-8"><title>Maintenance API — PostgreSQL</title><style>body{font-family:Arial;max-width:900px;margin:40px auto;padding:0 20px}button{padding:8px 14px}pre{background:#f3f3f3;padding:15px;overflow:auto}</style></head><body><h1>Maintenance API</h1><p>Небольшая страница для проверки PostgreSQL API.</p><button id="health">Проверить API</button><pre id="out">Нажмите кнопку</pre><script>document.getElementById('health').onclick=async()=>{const r=await fetch('/api/health');document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
